[pytest]
testpaths = tests
# -ra: resumo de falhas/skips ao final | --strict-markers: marcador inexistente = erro (evita typo)
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
junit_family = xunit2
junit_suite_name = api-validation
# Nenhum teste pode travar o pipeline: 30 s por teste (pytest-timeout).
timeout = 30
markers =
    mock: roda contra o serviço de referência local (determinístico, sem internet)
    live: roda contra APIs públicas reais (BrasilAPI, ViaCEP, Jitsi) - depende de terceiros
    contract: valida status HTTP e schemas de request/response
    cors: valida a política CORS (simple requests, preflight, credenciais)

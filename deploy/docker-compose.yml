# Sobe tudo: banco (PostgreSQL), API e site com HTTPS automático (Caddy).
#   cp .env.example .env   # edite os valores
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mente_saudavel
      POSTGRES_USER: mente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mente -d mente_saudavel"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://mente:${POSTGRES_PASSWORD}@db:5432/mente_saudavel
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      CORS_ORIGINS: https://${DOMAIN:?defina DOMAIN no .env}
      DEMO_SEED: ${DEMO_SEED:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]          # sem "ports": a API só é acessível pelo Caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro        # site compilado (veja README-DEPLOY.md)
      - caddy_data:/data
      - caddy_config:/config
    networks: [interna]

networks:
  interna:

volumes:
  dbdata:
  caddy_data:
  caddy_config:

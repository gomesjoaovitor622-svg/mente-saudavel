name: Dependency Review

# Bloqueia PRs que introduzem dependências com vulnerabilidade conhecida de severidade alta ou crítica.
on:
  pull_request:
    branches: [main, master]

concurrency:
  group: dependency-review-${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

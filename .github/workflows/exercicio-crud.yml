name: Exercício CRUD (JSONPlaceholder)

# Analisa e testa o projeto exercicios/crud_jsonplaceholder (testes usam API falsa, sem internet).
on:
  push:
    branches: [main, master, dev]
    paths: ['exercicios/crud_jsonplaceholder/**', '.github/workflows/exercicio-crud.yml']
  workflow_dispatch:

concurrency:
  group: exercicio-crud-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash
    working-directory: exercicios/crud_jsonplaceholder

jobs:
  testar:
    name: analyze + testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze (qualquer problema reprova)
        run: flutter analyze --no-pub

      - name: flutter test
        run: flutter test --no-pub

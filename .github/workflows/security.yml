name: Security

# Segurança de cadeia de suprimentos e dos próprios workflows.
#   supply-chain ..... pip-audit (CVEs), SBOM CycloneDX, varredura de segredos
#   workflow-audit ... zizmor + actionlint (actions sem SHA, permissões, injeção de template)
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '23 5 * * 1'        # semanal: pega CVEs novas em dependências já fixadas
  workflow_dispatch:

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

defaults:
  run:
    shell: bash

jobs:
  supply-chain:
    name: Supply chain (CVEs, SBOM, segredos)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/api-validation/requirements-security.txt

      - name: Instalar ferramentas (hashes SHA-256 obrigatórios)
        run: pip install --require-hashes -r ci/api-validation/requirements-security.txt

      - name: Auditoria de vulnerabilidades (pip-audit)
        run: |
          pip-audit --require-hashes --disable-pip --strict \
            -r ci/api-validation/requirements.txt -r ci/api-validation/requirements-quality.txt

      - name: Gerar SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          cyclonedx-py requirements ci/api-validation/requirements.txt --of JSON -o sbom/sbom.cdx.json
          python -c "import json; d=json.load(open('sbom/sbom.cdx.json')); print('componentes no SBOM:', len(d['components']))"

      - name: Varredura de segredos (detect-secrets, com baseline versionado)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Enviar SBOM (retenção de 90 dias)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

  workflow-audit:
    name: Auditoria dos workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/api-validation/requirements-security.txt

      - name: Instalar zizmor (hashes SHA-256 obrigatórios)
        run: pip install --require-hashes -r ci/api-validation/requirements-security.txt

      - name: zizmor (segurança de GitHub Actions)
        env:
          GH_TOKEN: ${{ github.token }}   # somente leitura; habilita a checagem de commits impostores
        run: zizmor --format github .github

      - name: actionlint (binário verificado por SHA-256)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'  # pragma: allowlist secret (checksum público, não é segredo)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  security-gate:
    name: Security Gate
    needs: [supply-chain, workflow-audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Consolidar resultados
        env:
          SUPPLY: ${{ needs.supply-chain.result }}
          WORKFLOWS: ${{ needs.workflow-audit.result }}
        run: |
          echo "supply-chain=$SUPPLY | workflow-audit=$WORKFLOWS"
          [[ "$SUPPLY" == "success" && "$WORKFLOWS" == "success" ]]

name: Analisar código (Flutter)

# Análise estática do app (`flutter analyze`). Os problemas viram anotações no PR/commit.
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  analisar:
    name: flutter analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Analisar (erros e avisos reprovam; "info" não)
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"
          code=${PIPESTATUS[0]}
          python3 tools/flutter_annotations.py < "$RUNNER_TEMP/analyze.txt"
          exit "$code"

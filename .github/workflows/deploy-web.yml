name: Publicar versão Web

# Publica o CRUD (exercicios/crud_jsonplaceholder) como site no GitHub Pages.
# Ative antes (uma vez): Settings > Pages > Source: "GitHub Actions".
# Endereço: https://<usuario>.github.io/<repositorio>/
# (O app Mente Saudável completo roda no servidor próprio — veja deploy/README-DEPLOY.md.)
on:
  push:
    branches: [main, master, dev]
    paths: ['exercicios/crud_jsonplaceholder/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false      # nunca interrompe um deploy em andamento

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compilar o site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REPO_NAME: ${{ github.event.repository.name }}   # via env: nunca interpolar contexto dentro do script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta web (em pasta temporária)
        working-directory: exercicios/crud_jsonplaceholder
        run: |
          flutter create --platforms=web --project-name crud_jsonplaceholder "$RUNNER_TEMP/gerado"
          cp -r "$RUNNER_TEMP/gerado/web" ./web

      - name: Compilar o site
        working-directory: exercicios/crud_jsonplaceholder
        run: |
          flutter pub get
          flutter build web --release --base-href "/${REPO_NAME}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: exercicios/crud_jsonplaceholder/build/web

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write                # publicar o site no GitHub Pages
      id-token: write             # OIDC exigido pela action deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

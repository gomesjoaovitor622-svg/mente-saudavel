name: Teste de implantação

# Sobe a pilha COMPLETA (PostgreSQL + API + site Flutter + Caddy) com o mesmo docker-compose
# usado no servidor e confere, por HTTPS, que site e API respondem e que o login funciona.
on:
  push:
    branches: [main, master, dev]
    paths: ['deploy/**', 'server/**', 'lib/**', 'tests/e2e/**', 'pubspec.yaml', '.github/workflows/deploy-smoke.yml']
  workflow_dispatch:

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Subir a pilha e testar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Testar rotação e verificação do backup
        run: bash deploy/backup/test-backup.sh

      - name: Configuração de teste (segredos aleatórios, só para este job)
        working-directory: deploy
        run: |
          {
            echo "DOMAIN=localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "PRONTUARIO_KEYS=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "DEMO_SEED=true"
          } > .env

      - name: Subir tudo (compila o site Flutter)
        working-directory: deploy
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 900

      - name: Site e API respondem por HTTPS
        run: |
          set -euo pipefail
          base=https://localhost
          code=$(curl -ksS -o /tmp/index.html -w '%{http_code}' "$base/")
          [[ "$code" == 200 ]] || { echo "site: HTTP $code"; exit 1; }
          grep -qi 'flutter' /tmp/index.html || { echo "index.html não parece ser o site Flutter"; exit 1; }
          curl -ksSf "$base/api/health" | tee /dev/stderr | grep -q '"ok"'
          # rota desconhecida do site volta ao index.html (SPA)
          [[ "$(curl -ksS -o /dev/null -w '%{http_code}' "$base/qualquer-rota")" == 200 ]]
          # a API exige login
          [[ "$(curl -ksS -o /dev/null -w '%{http_code}' "$base/api/sessoes")" == 401 ]]
          # login real com a conta de demonstração e uma consulta autenticada
          token=$(curl -ksSf -X POST "$base/api/auth/entrar" -H 'content-type: application/json' \
            -d '{"email":"carlos@email.com","senha":"123456"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          curl -ksSf "$base/api/profissionais" -H "authorization: Bearer $token" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert len(d)>=3, d; print("profissionais:", len(d))'
          # a documentação da API não pode estar exposta em produção
          [[ "$(curl -ksS -o /dev/null -w '%{http_code}' "$base/api/docs")" != 200 ]]
          # cabeçalhos de segurança do Caddy
          curl -ksSI "$base/" | grep -qi '^strict-transport-security'
          # CSP presente e sem as liberações perigosas
          csp=$(curl -ksSI "$base/" | grep -i '^content-security-policy' || true)
          [[ -n "$csp" ]] || { echo 'sem Content-Security-Policy'; exit 1; }
          ! grep -qE "script-src[^;]*('unsafe-inline'|'unsafe-eval'|\*)" <<< "$csp"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar o Playwright (navegador de teste)
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Testar o site no navegador (clica nas telas de verdade)
        run: python tests/e2e/site_e2e.py https://localhost "$RUNNER_TEMP/e2e-shots"

      - name: Guardar capturas de tela (celular e falhas)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-capturas
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: Logs em caso de falha
        if: ${{ failure() }}
        working-directory: deploy
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=120

      - name: Derrubar
        if: ${{ always() }}
        working-directory: deploy
        run: docker compose -f docker-compose.prod.yml down -v

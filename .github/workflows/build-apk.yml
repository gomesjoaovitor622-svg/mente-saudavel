name: Gerar APK

# Roda sozinho a cada envio para o GitHub, ou manualmente em Actions > Gerar APK > Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android (numa pasta temporária, sem tocar no seu código)
        run: |
          flutter create --platforms=android --project-name mente_saudavel --org br.edu.ifro.mentesaudavel /tmp/gerado
          cp -r /tmp/gerado/android ./android

      - name: Liberar internet no app e definir o nome
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Mente Saudável"#' "$MANIFEST"
          grep -n "INTERNET\|android:label" "$MANIFEST"

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: MenteSaudavel-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar o APK em Releases (para baixar direto no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mente Saudável - APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

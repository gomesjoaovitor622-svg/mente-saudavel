name: Build APK

# build ..... compila e guarda o APK como artefato (push/PR/manual). Somente leitura.
# release ... publica em Releases com atestado de procedência. Só em tag vX.Y.Z ou manual (release=true).
on:
  push:
    branches: [main, master, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      demo:
        description: 'Incluir contas e dados de demonstração no app?'
        type: boolean
        default: true
      release:
        description: 'Publicar o APK em Releases?'
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Definir o modo do app (demo x produção)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_DEMO: ${{ inputs.demo }}
        run: |
          # Tag de versão = build de PRODUÇÃO (sem contas/dados de demonstração).
          if [[ "$REF" == refs/tags/* ]]; then demo=false
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then demo="$INPUT_DEMO"
          else demo=true; fi
          echo "DEMO_MODE=$demo" >> "$GITHUB_ENV"
          echo "Modo demo: $demo"

      - name: Gerar a pasta android (em pasta temporária, sem tocar no código do app)
        run: |
          flutter create --platforms=android --project-name mente_saudavel --org br.edu.ifro.mentesaudavel "$RUNNER_TEMP/gerado"
          cp -r "$RUNNER_TEMP/gerado/android" ./android

      - name: Permissão de internet e nome do app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Mente Saudável"#' "$MANIFEST"

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release --dart-define=DEMO_MODE="$DEMO_MODE"

      - name: Assinar com a chave de produção (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          if [[ -z "${KEYSTORE_B64:-}" ]]; then
            echo "::warning title=APK com assinatura de TESTE::Configure os segredos ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD. Sem eles o APK não pode ser atualizado por cima de outro build e não serve para a Play Store."
            exit 0
          fi
          ks="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          apksigner="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/assinado.apk" "$apk"
          "$apksigner" verify --print-certs "$RUNNER_TEMP/assinado.apk" | grep -E "^Signer #1 certificate SHA-256"
          mv "$RUNNER_TEMP/assinado.apk" "$apk"

      - name: Preparar artefato (APK + SHA-256)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MenteSaudavel.apk
          (cd dist && sha256sum MenteSaudavel.apk | tee MenteSaudavel.apk.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MenteSaudavel-APK
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write             # criar a release (única escrita em repositório do workflow)
      id-token: write             # assinatura keyless do atestado
      attestations: write         # grava o atestado de procedência
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MenteSaudavel-APK
          path: dist

      - name: Atestar procedência do APK (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MenteSaudavel.apk

      - name: Publicar em Releases (idempotente, reexecutar atualiza os arquivos)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-{0}', github.run_number) }}
          TITLE: Mente Saudável ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('(build {0})', github.run_number) }}
          SHA: ${{ github.sha }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/MenteSaudavel.apk dist/MenteSaudavel.apk.sha256 --clobber
          else
            gh release create "$TAG" dist/MenteSaudavel.apk dist/MenteSaudavel.apk.sha256 \
              --title "$TITLE" --target "$SHA" --generate-notes
          fi
